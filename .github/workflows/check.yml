name: Check DTEK House Status

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright Chromium
        run: |
          npm init -y > /dev/null
          npm install --no-save playwright
          npx playwright install chromium
      - name: Fetch house status
        env:
          DTEK_CITY: ${{ secrets.DTEK_CITY }}
          DTEK_STREET: ${{ secrets.DTEK_STREET }}
          DTEK_HOUSE: ${{ secrets.DTEK_HOUSE }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          SVITLOBOT_CHAT_ID: ${{ secrets.SVITLOBOT_CHAT_ID }}
        run: node check.mjs
      - name: Commit status.json if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add status.json
          if ! git diff --cached --quiet; then
            git commit -m "Update house status"
            git push
          fi
